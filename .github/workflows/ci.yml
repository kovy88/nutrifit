name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  mobile:
    name: mobile (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js's realtime client needs the native WebSocket
          # global, which Node only ships stable from v22 — Node 20 throws at
          # import time (see PR #33 CI's first-ever failed run).
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Baseline verified clean on 2026-07-18; a failure here means a new
      # high-severity advisory landed upstream, not a broken PR.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  root:
    name: root (api/backend logic tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Baseline verified clean on 2026-07-18; a failure here means a new
      # high-severity advisory landed upstream, not a broken PR.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test
