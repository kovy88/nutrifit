<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Garmin Connect — NutriFit</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background:#111815; color:#f7f7f4; margin:0; padding:32px; text-align:center; line-height:1.5; }
    h1 { color:#309965; font-size:24px; margin-bottom:8px; }
    p  { color:#a3b1a9; max-width:380px; margin:12px auto; }
    a.button { display:inline-block; background:#007cc3; color:#fff; padding:12px 24px;
               border-radius:8px; text-decoration:none; font-weight:700; margin-top:18px; }
  </style>
</head>
<body>
  <h1>✓ Garmin propojen</h1>
  <p id="status">Vracím tě zpět do NutriFit appky…</p>
  <a class="button" id="openApp" href="#">Otevřít NutriFit</a>

  <script>
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    var state = params.get('state');
    var error = params.get('error');
    var deepLink;
    if (error) {
      deepLink = 'nutrifit://garmin/callback?error=' + encodeURIComponent(error)
        + (state ? '&state=' + encodeURIComponent(state) : '');
      document.getElementById('status').textContent =
        'Garmin propojení odmítnuto (' + error + ').';
    } else if (code) {
      deepLink = 'nutrifit://garmin/callback?code=' + encodeURIComponent(code)
        + (state ? '&state=' + encodeURIComponent(state) : '');
    } else {
      deepLink = 'nutrifit://garmin/callback?error=missing_code';
      document.getElementById('status').textContent = 'V URL chybí `code` ani `error`.';
    }
    document.getElementById('openApp').href = deepLink;
    setTimeout(function () { window.location.href = deepLink; }, 250);
  </script>
</body>
</html>
