<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Strava připojení — NutriFit</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background:#111815; color:#f7f7f4; margin:0; padding:32px; text-align:center; line-height:1.5; }
    h1 { color:#309965; font-size:24px; margin-bottom:8px; }
    p  { color:#a3b1a9; max-width:380px; margin:12px auto; }
    a.button { display:inline-block; background:#fc4c02; color:#fff; padding:12px 24px;
               border-radius:8px; text-decoration:none; font-weight:700; margin-top:18px; }
    code { background:#1b2420; padding:2px 6px; border-radius:4px; font-size:12px; }
  </style>
</head>
<body>
  <h1>✓ Strava propojena</h1>
  <p id="status">Vracím tě zpět do NutriFit appky…</p>
  <a class="button" id="openApp" href="#">Otevřít NutriFit</a>

  <script>
    // Strava redirectne sem s `?code=...&scope=...` nebo `?error=access_denied`.
    // My to přebalíme do `nutrifit://strava/callback?code=...` a zkusíme spustit
    // app. Pokud uživatel zavřel browser a otevřel později, klikne na button.
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    var state = params.get('state');
    var error = params.get('error');
    var deepLink;
    if (error) {
      deepLink = 'nutrifit://strava/callback?error=' + encodeURIComponent(error)
        + (state ? '&state=' + encodeURIComponent(state) : '');
      document.getElementById('status').textContent =
        'Strava propojení odmítnuto (' + error + '). Otevři appku znovu pro opakování.';
    } else if (code) {
      deepLink = 'nutrifit://strava/callback?code=' + encodeURIComponent(code)
        + (state ? '&state=' + encodeURIComponent(state) : '');
    } else {
      document.getElementById('status').textContent =
        'V URL chybí `code` ani `error`. Něco se pokazilo.';
      deepLink = 'nutrifit://strava/callback?error=missing_code';
    }
    document.getElementById('openApp').href = deepLink;
    // Auto-launch (works on iOS Safari; Android Chrome blocks bez user gesture)
    setTimeout(function () { window.location.href = deepLink; }, 250);
  </script>
</body>
</html>
